name: ssh-mongo-tunnel
description: Forward localhost:27017 to CX33 Mongo
inputs:
  ssh_key:
    required: true
  host:
    required: true
  user:
    required: false
    default: root
runs:
  using: composite
  steps:
    - name: Start SSH tunnel
      shell: bash
      env:
        HETZNER_SSH_KEY: ${{ inputs.ssh_key }}
        HETZNER_HOST: ${{ inputs.host }}
        HETZNER_USER: ${{ inputs.user }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner
        chmod 600 ~/.ssh/hetzner
        USERNAME="${HETZNER_USER:-}"
        USERNAME="${USERNAME:-root}"
        ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
        for attempt in 1 2 3 4 5; do
          if ssh -f -N -L 27017:127.0.0.1:27017 \
            -i ~/.ssh/hetzner \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=12 \
            -o ConnectTimeout=15 \
            "${USERNAME}@${HETZNER_HOST}"; then
            exit 0
          fi
          echo "SSH tunnel attempt ${attempt} failed; retrying…" >&2
          sleep $((attempt * 4))
        done
        echo "SSH tunnel failed after 5 attempts" >&2
        exit 1
