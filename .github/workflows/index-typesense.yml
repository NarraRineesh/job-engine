name: index-typesense

on:
  workflow_dispatch:
  schedule:
    # Wednesday 02:30 UTC — after Monday multi + Tuesday singleton
    - cron: "30 2 * * 3"

concurrency:
  group: index-typesense
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API_URL: https://api.glowminds.in
      INDEX_API_KEY: ${{ secrets.INDEX_API_KEY }}
    steps:
      - name: Trigger Typesense index
        run: |
          set -euo pipefail
          if [ -z "${INDEX_API_KEY:-}" ]; then
            echo "INDEX_API_KEY secret is missing" >&2
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/index.json -w "%{http_code}" -X POST "$API_URL/v1/index" \
            -H "Authorization: Bearer $INDEX_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"recreate":false}')
          cat /tmp/index.json
          echo
          if [ "$CODE" != "202" ] && [ "$CODE" != "409" ]; then
            echo "unexpected HTTP $CODE" >&2
            exit 1
          fi

      - name: Wait until index finishes
        run: |
          set -euo pipefail
          for i in $(seq 1 360); do
            curl -sS -o /tmp/index.json "$API_URL/v1/index" \
              -H "Authorization: Bearer $INDEX_API_KEY"
            cat /tmp/index.json
            echo
            STATUS=$(python3 -c 'import json; print(json.load(open("/tmp/index.json")).get("status",""))')
            if [ "$STATUS" = "done" ]; then
              exit 0
            fi
            if [ "$STATUS" = "error" ]; then
              exit 1
            fi
            sleep 30
          done
          echo "index did not finish in time" >&2
          exit 1
